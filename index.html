<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, intuitive task management system.">
  <meta property="og:title" content="Task Management System">
  <meta property="og:description" content="Organize tasks with drag-and-drop, customizable boards, and local storage.">
  <meta property="og:image" content="./src/img/preview.png">
  <meta property="og:url" content="https://cracky.ddns.net/tms/">
  <title>Task Management System</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="icon" href="./src/img/favicon.png" type="image/x-icon">
</head>
<body>
  <div class="overlay-bg" id="bg-image"></div>
  <header>
    <h1><a href="https://cracky.ddns.net/tms/">TMS</a></h1>
    <div class="task-counter" id="totalTask">0</div>
    <div class="actions">
      <button class="btn btn--primary" id="addToDo" aria-label="Add new task">New Task</button>
      <button class="btn btn--urgent" id="addUrgent" aria-label="Toggle urgent list">Urgent List</button>
      <button class="btn btn--delete" id="deleteItem" aria-label="Delete all tasks">Clear All</button>
    </div>
    <div class="options" id="optionsPanel">
      <button class="btn btn--options" id="toggleOptions" aria-label="Toggle options">Options</button>
      <div class="options-menu">
        <button class="btn btn--bg" id="boardBg" aria-label="Change background">Background</button>
        <div class="bg-options" id="bgOptions">
          <span data-bg="mountain">Mountain</span>
          <span data-bg="coast">Coast</span>
          <span data-bg="space">Space</span>
          <span data-bg="code">Code</span>
          <span data-bg="kali">Kali</span>
          <span data-bg="url">URL</span>
          <span data-bg="none">None</span>
          <div class="url-input" id="byUrl">
            <input type="url" id="urlImage" placeholder="Enter image URL">
            <button id="submitUrl" aria-label="Submit background URL">OK</button>
          </div>
        </div>
        <button class="btn btn--height" id="boardFull" aria-label="Toggle full height">Full Height</button>
        <div class="opacity-control">
          <label for="boardOpac">Opacity</label>
          <input type="range" id="boardOpac" min="0" max="10" value="5" step="1" aria-label="Adjust board opacity">
        </div>
        <button class="btn btn--warning" id="optionCfrm" aria-label="Toggle delete confirmation">Delete Warning</button>
        <button class="btn btn--clear" id="optionOptns" aria-label="Clear options">Clear Options</button>
      </div>
    </div>
  </header>

  <main id="myLists">
    <section id="to-do">
      <h2>To Do <span class="task-count">0</span></h2>
      <ul id="ul-todo" class="task-list" data-list="todo"></ul>
    </section>
    <section id="work-in">
      <h2>In Progress <span class="task-count">0</span></h2>
      <ul id="ul-working" class="task-list" data-list="working"></ul>
    </section>
    <section id="do-ne">
      <h2>Done <span class="task-count">0</span></h2>
      <ul id="ul-done" class="task-list" data-list="done"></ul>
    </section>
  </main>

  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="modalBox">
    <p id="modalDesc">Describe the Task</p>
    <textarea id="taskText" aria-label="Task description"></textarea>
    <button class="btn btn--primary" id="taskButton">Save</button>
    <button class="btn btn--secondary" id="modalClose">Cancel</button>
  </div>

  <div class="confirm-overlay" id="confirmDelete"></div>
  <div class="confirm-box" id="confirmBox">
    <p><span id="confirmTitle">Task</span> will be deleted...</p>
    <label><input type="checkbox" id="dontShowAgain"> Don't show again</label>
    <button class="btn btn--delete" id="confirmBtn">Delete</button>
    <button class="btn btn--secondary" id="confirmCls">Cancel</button>
  </div>
  <div class="confirm-box" id="confirmUrgent">
    <p><span id="numTaskUrg"></span> Task<span id="pluralTsk">s</span> in Urgent list will be deleted...</p>
    <label><input type="checkbox" id="dontShowAgainUrgent"> Don't show again</label>
    <button class="btn btn--urgent" id="confirmUrgentBtn">Remove Anyway</button>
    <button class="btn btn--secondary" id="confirmUrgentCls">Cancel</button>
  </div>

  <footer>
    <div class="footer-actions">
      <button class="btn btn--import" id="impBrd" aria-label="Import board">Import</button>
      <input type="file" id="fileInput" style="display: none;" accept=".tms">
      <button class="btn btn--export" id="expBrd" aria-label="Export board">Export</button>
      <a id="expHidden" href="#" style="display: none;"></a>
    </div>
  </footer>

  <script src="./src/js/app.js"></script>
</body>
</html>
